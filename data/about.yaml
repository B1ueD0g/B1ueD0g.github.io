ietf:
  title: "IETF / Standards Work · 标准工作"
  intro: "围绕 AI 智能体安全、远程证明与 TLS 形式化分析，参与开放标准研究与协议设计。"
  items:
    - status: "Active individual I-D · Author"
      title: "Security Principal and Verifier Binding for Agent Communication Protocols"
      group: "AI Agent Security"
      note: "面向智能体通信的安全主体识别、验证者绑定与身份连续性设计。"
      version: "-07 · 2026-09-15"
      url: "https://datatracker.ietf.org/doc/draft-bu-agentproto-security-principal-binding/"
    - status: "Active individual I-D · Co-author"
      title: "Agent Accountability: Composition and Conformance"
      group: "Agent Accountability"
      note: "以 CAN、WHO、WHAT、AUDIT 四类可独立验证档案组合责任链，并定义共享一致性测试向量。"
      version: "-01 · 2026-08-16"
      url: "https://datatracker.ietf.org/doc/draft-mih-sato-agent-accountability-composition/"
    - status: "Active individual I-D · Co-author"
      title: "Proposed Document Template for TLS FATT Process"
      group: "TLS / Formal Analysis"
      note: "为需要形式化分析的 TLS 扩展提出文档模板，明确威胁模型、安全目标与协议图要求。"
      version: "-09 · 2026-07-06"
      url: "https://datatracker.ietf.org/doc/draft-usama-tls-fatt-extension/"
    - status: "Active individual I-D · Co-author"
      title: "Early Attestation Considered Very Harmful"
      group: "Attested TLS"
      note: "结合漏洞研究与形式化分析，研究远程证明在 TLS 握手中的安全组合。"
      version: "-54 · 2026-10-03"
      url: "https://datatracker.ietf.org/doc/draft-intra-handshake-fail/"
    - status: "Active individual I-D · Co-author"
      title: "Guidelines for Security Considerations of RATS"
      group: "Remote Attestation"
      note: "远程证明安全考虑指南，涵盖认证层次、威胁建模、重放与中继攻击。"
      version: "-06 · 2026-09-29"
      url: "https://datatracker.ietf.org/doc/draft-sardar-rats-sec-cons/"
  activities:
    - date: "2026-10-01"
      role: "审阅致谢"
      title: "IPsecME · Separate Transports for IKE and ESP"
      note: "-08 的致谢部分列出 Songbo Bu；这是审阅贡献，不是该草案的作者署名。"
      url: "https://datatracker.ietf.org/doc/html/draft-ietf-ipsecme-ikev2-reliable-transport-08#section-8"
    - date: "2026-09-28 UTC"
      role: "公开技术讨论"
      title: "IRTF UFMRG · EarlyAttestationBleed"
      note: "讨论实现复杂度、验证责任，以及 ProVerif 事件参数与对应查询的建模边界。"
      url: "https://mailarchive.ietf.org/arch/msg/ufmrg/_Jyk7JiwKmJUgIYfL4vAZhboXDs/"
    - date: "2026-09-19 UTC"
      role: "公开技术讨论"
      title: "Agent2Agent · Logical-agent continuity"
      note: "澄清恢复分支中的前序记录绑定与权限边界；属于候选设计讨论，不代表新的已发布协议或互操作验证。"
      url: "https://mailarchive.ietf.org/arch/msg/agent2agent/MVp3_IWFP25GByrU91Zenef6Zwk/"

security:
  title: "Security Research · 公开漏洞披露"
  intro: "聚焦机密计算、远程证明与身份认证，开展漏洞研究与协同披露。"
  items:
    - title: "CVE-2026-92701 · Cocos AI / Intel TDX"
      date: "CVE 公开：2026-09-18"
      role: "共同发现与披露"
      note: "与 Muhammad Usama Sardar 共同发现 Intel TDX 验证路径的会话绑定缺陷。CVSS 3.1：9.1（Critical）；0.9.0 修复。"
      url: "https://github.com/ultravioletrs/cocos/security/advisories/GHSA-4px3-wj2x-xx47"
      cve_url: "https://www.cve.org/CVERecord?id=CVE-2026-92701"
    - title: "CVE-2026-92702 · Cocos AI / AMD SEV-SNP"
      date: "CVE 公开：2026-09-18"
      role: "共同发现与披露"
      note: "与 Muhammad Usama Sardar 共同发现预期 reportData 为 nil、空或缺省时的证明绑定缺陷。CVSS 3.1：9.1（Critical）；0.9.0 修复。"
      url: "https://github.com/ultravioletrs/cocos/security/advisories/GHSA-4r6g-mp48-j2rw"
      cve_url: "https://www.cve.org/CVERecord?id=CVE-2026-92702"
    - title: "GHSA-322v-xwfj-63cm · Privasys JWT 验证"
      date: "2026-09-19"
      role: "共同发现与披露"
      note: "与 Chengxin Huang、Muhammad Usama Sardar 协同披露未启用 wasm 特性的构建中缺少 JWT 签名验证的问题。CVSS 3.1：9.8（Critical）；公告尚未列出 CVE。"
      url: "https://github.com/Privasys/enclave-os-mini/security/advisories/GHSA-322v-xwfj-63cm"
    - title: "GHSA-376m-h37w-4rvq · Contrast 权限配置"
