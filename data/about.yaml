highlights:
  - "三只猫的铲屎官：Lemon（2023-09-07）、凉茶（2024-08-27）、曹可可（2026-04-11）。世界破破烂烂～～小猫缝缝补补。"
  - "1）把数据安全当工程，把 AI 安全当未来。"
  - "2）白天做项目经理，晚上做研究分析师；偶尔做译者，长期做交付。"
  - "3）标准、书、课程、漏洞——能写的我写，能审的我审，能修的我修。"
  - "少年驰骋的风比黄金还要珍贵。"

