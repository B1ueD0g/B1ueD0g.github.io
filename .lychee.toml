verbose = "info"
max_retries = 2
retry_wait_time = 2
timeout = 20
# Bound network pressure rather than accepting temporary server failures.
max_concurrency = 16
host_concurrency = 4
insecure = false
exclude_all_private = true

# Some sites may block CI user agents or return rate-limited status.
accept = [200, 206, 301, 302, 307, 308, 403, 429]

exclude = [
  "^mailto:",
  "^tel:",
  "^javascript:",
  "^#",
  # Required official filing link returns HTTP 521 to automated checks.
  # Skip only this canonical root URL; all other URLs/status rules stay checked.
  "^https://beian[.]miit[.]gov[.]cn/$",
]

[hosts."translate.google.com"]
concurrency = 1
request_interval = "100ms"

[hosts."github.com"]
concurrency = 2
request_interval = "200ms"
