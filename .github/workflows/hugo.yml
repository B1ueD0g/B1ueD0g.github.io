name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.157.0"
      HUGO_ENVIRONMENT: production
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chinese cover fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Node dependencies
        run: npm ci

      - name: Validate release integrations
        run: python3 scripts/check_release_integrations.py

      - name: Validate 404 game engine
        run: node scripts/check_not_found_engine.cjs

      - name: Validate post metadata quality
        run: python3 scripts/check_metadata_quality.py

      - name: Generate article short links
        run: python3 scripts/generate_shortlinks.py

      - name: Generate article social cards
        run: python3 scripts/generate_og_cards.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build with Hugo
        run: hugo --gc --minify

      - name: Check links in generated site
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >
            --config .lychee.toml
            --root-dir "${{ github.workspace }}/public"
            --remap '^https://bluedog[.]website/(.*)$ file://${{ github.workspace }}/public/$1'
            --no-progress
            "public/**/*.html"
            "public/**/*.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pagefind index
        run: npm run index:search

      - name: Validate generated site contracts
        run: npm run check:site

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Run Lighthouse CI quality gate
        run: lhci autorun --config=.lighthouserc.json

      - name: Require all three Research runs within the TBT budget
        run: python3 scripts/check_research_performance.py

      - name: Upload sitemap for post-deployment IndexNow notification
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap
          path: public/sitemap.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout notification script
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the sitemap from this deployment
        uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemap
          path: public

      - name: Verify published key and submit sitemap URLs to IndexNow
        env:
          INDEXNOW_HOST: "bluedog.website"
          INDEXNOW_KEY: "7baa35b46459468eb9eeed80b9885b5b"
          INDEXNOW_KEY_LOCATION: "https://bluedog.website/7baa35b46459468eb9eeed80b9885b5b.txt"
          INDEXNOW_ENDPOINT: "https://www.bing.com/indexnow"
        run: |
          python3 scripts/submit_indexnow.py \
            --sitemap public/sitemap.xml \
            --host "${INDEXNOW_HOST}" \
            --key "${INDEXNOW_KEY}" \
            --key-location "${INDEXNOW_KEY_LOCATION}" \
            --endpoint "${INDEXNOW_ENDPOINT}"
