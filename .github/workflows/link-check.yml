name: Link Check

on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-link-audit
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Generate article short links
        run: python3 scripts/generate_shortlinks.py

      - name: Build site
        run: hugo --gc --minify

      - name: Check links in markdown and HTML output
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >
            --config .lychee.toml
            --root-dir "${{ github.workspace }}/public"
            --remap '^https://bluedog[.]website/(.*)$ file://${{ github.workspace }}/public/$1'
            --no-progress
            "content/**/*.md"
            "public/**/*.html"
            "public/**/*.xml"
