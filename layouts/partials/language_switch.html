{{- $origin := printf "%s://%s" (urls.Parse site.BaseURL).Scheme (urls.Parse site.BaseURL).Host -}}
{{- $canonical := .Permalink -}}
<details id="language-switch" class="notranslate" translate="no" data-language-switch data-language-origin="{{ $origin }}" data-language-canonical="{{ $canonical }}">
  <summary aria-label="语言 / Languages" title="语言 / Languages">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c5 5 5 13 0 18C7 16 7 8 12 3Z"/>
    </svg>
  </summary>
  <div class="language-panel">
    <p>整页自动翻译 · Google Translate</p>
    <nav aria-label="页面语言">
      <a data-language-original href="{{ $canonical }}" lang="zh-CN" aria-current="page">中文原文</a>
      <a data-language-target="en" href="{{ printf "https://translate.google.com/translate?sl=zh-CN&tl=en&u=%s" ($canonical | urlquery) }}" lang="en" target="_blank" rel="noopener noreferrer">English <span aria-hidden="true">↗</span></a>
      <a data-language-target="de" href="{{ printf "https://translate.google.com/translate?sl=zh-CN&tl=de&u=%s" ($canonical | urlquery) }}" lang="de" target="_blank" rel="noopener noreferrer">Deutsch <span aria-hidden="true">↗</span></a>
    </nav>
    <p>中文原页会保留</p>
  </div>
</details>
