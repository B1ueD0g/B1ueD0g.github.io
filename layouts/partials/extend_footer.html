<footer class="custom-min-footer">
  <div class="footer-inner">
    <p>{{ site.Params.footer.text | default "Progress, Not Perfection" }}</p>
    {{- with site.Params.footer.icp }}
    <a class="footer-icp notranslate" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" lang="zh-CN" translate="no">
      <span>{{ . }}</span>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    {{- end }}
  </div>
</footer>

<div id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-atomic="true"></div>
{{- $siteEnhance := resources.Get "js/site-enhance.js" | minify | fingerprint -}}

<script>
  (function () {
    var ua = navigator.userAgent || "";
    var isWeChatWebView = /MicroMessenger/i.test(ua);

    window.BlueDogEnv = window.BlueDogEnv || {};
    window.BlueDogEnv.isWeChatWebView = isWeChatWebView;
    window.BlueDogEnv.homePath = {{ "" | absLangURL | jsonify | safeJS }};
    window.BlueDogEnv.searchPath = {{ "search/" | absLangURL | jsonify | safeJS }};
    window.BlueDogEnv.postsPath = {{ "posts/" | absLangURL | jsonify | safeJS }};

    if (isWeChatWebView) {
      document.documentElement.classList.add("wechat-safe");
      if (document.body) document.body.classList.add("wechat-safe");
      return;
    }

    var script = document.createElement("script");
    script.src = "{{ $siteEnhance.RelPermalink }}";
    script.defer = true;
    document.body.appendChild(script);
  })();
</script>

{{- $languageSwitch := resources.Get "js/language-switch.js" | minify | fingerprint -}}
<script defer src="{{ $languageSwitch.RelPermalink }}" integrity="{{ $languageSwitch.Data.Integrity }}" crossorigin="anonymous"></script>
